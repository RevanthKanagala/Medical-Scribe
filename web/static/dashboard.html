<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Executive Operations Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .dashboard-shell {
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .dashboard-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .dashboard-header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #f8fafc;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      color: #f8fafc;
      text-decoration: none;
      font-weight: 600;
    }
    .grid {
      display: grid;
      gap: 18px;
    }
    .grid-4 {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .grid-3 {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .panel {
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(2,6,23,0.5);
    }
    .panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #cbd5f5;
      letter-spacing: 0.5px;
    }
    .kpi-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi-value {
      font-size: 2rem;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
    }
    .badge.red {background:#fee2e2;color:#991b1b;}
    .badge.yellow {background:#fef3c7;color:#92400e;}
    .badge.green {background:#d1fae5;color:#065f46;}
    .badge.gray {background:#e2e8f0;color:#1f2937;}
    .trend-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(148,163,184,0.2);
      overflow: hidden;
      margin-top: 6px;
    }
    .trend-bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
    }
    .chart-line {
      height: 160px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .chart-bar {
      flex: 1;
      background: linear-gradient(180deg, rgba(59,130,246,0.9), rgba(37,99,235,0.4));
      border-radius: 12px 12px 0 0;
      position: relative;
    }
    .chart-bar span {
      position: absolute;
      bottom: 100%;
      transform: translateY(-6px);
      font-size: 0.75rem;
      color: #cbd5f5;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .list-item strong {color:#f8fafc;}
    .muted {color:#94a3b8;font-size:0.9rem;}
    .divider {
      margin: 12px 0;
      border-top: 1px dashed rgba(148,163,184,0.3);
    }
    @media (max-width: 768px) {
      .dashboard-shell {padding: 24px 16px;}
    }
  </style>
</head>
<body>
  <div class="dashboard-shell">
    <div class="dashboard-header">
      <div>
        <h1>Hospital Command Center</h1>
        <p id="dashboardStatus" class="muted">Loading live metrics…</p>
      </div>
      <a class="back-link" href="index.html">← Back to Portal</a>
    </div>

    <section class="panel">
      <h2>🚨 Critical Alerts</h2>
      <div class="grid grid-4" id="criticalAlerts"></div>
    </section>

    <section class="panel">
      <h2>📊 Patient Flow</h2>
      <div class="grid grid-2">
        <div>
          <div class="grid grid-2" id="patientFlowCards"></div>
          <div class="divider"></div>
          <div>
            <p class="muted">Patients per hour</p>
            <div class="chart-line" id="patientsPerHour"></div>
          </div>
        </div>
        <div>
          <p class="muted">Throughput Highlights</p>
          <ul id="patientInsights"></ul>
        </div>
      </div>
    </section>

    <section class="grid grid-2">
      <div class="panel">
        <h2>👨‍⚕️ Doctor Workload</h2>
        <div id="doctorWorkload"></div>
      </div>
      <div class="panel">
        <h2>⏱️ Time & Efficiency</h2>
        <div id="efficiencyMetrics"></div>
      </div>
    </section>

    <section class="grid grid-3">
      <div class="panel">
        <h2>🤖 AI Reliability</h2>
        <div id="aiReliability"></div>
      </div>
      <div class="panel">
        <h2>⚠️ Clinical Risk Monitoring</h2>
        <div id="riskMonitoring"></div>
      </div>
      <div class="panel">
        <h2>🔄 System Health</h2>
        <div id="systemHealth"></div>
      </div>
    </section>

    <section class="panel">
      <h2>📈 Trends & Insights</h2>
      <div class="grid grid-4" id="trendCards"></div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById('dashboardStatus');
    const criticalAlertsEl = document.getElementById('criticalAlerts');
    const patientFlowCardsEl = document.getElementById('patientFlowCards');
    const patientsPerHourEl = document.getElementById('patientsPerHour');
    const patientInsightsEl = document.getElementById('patientInsights');
    const doctorWorkloadEl = document.getElementById('doctorWorkload');
    const efficiencyEl = document.getElementById('efficiencyMetrics');
    const aiReliabilityEl = document.getElementById('aiReliability');
    const riskMonitoringEl = document.getElementById('riskMonitoring');
    const systemHealthEl = document.getElementById('systemHealth');
    const trendCardsEl = document.getElementById('trendCards');

    const formatHour = (hour) => `${String(hour).padStart(2, '0')}:00`;

    function renderCriticalAlerts(alerts) {
      criticalAlertsEl.innerHTML = '';
      const configs = [
        { label: 'High Risk Cases', value: alerts.high_risk_cases ?? 0, status: 'red', note: 'Symptom load ≥4' },
        { label: 'Validation Warnings', value: alerts.validation_failures ?? 0, status: 'yellow', note: 'Summary vs symptom mismatch' },
        { label: 'Pending Summaries', value: alerts.pending_summaries ?? 0, status: 'yellow', note: 'Transcripts awaiting summaries' },
        { label: 'Unknown Mentions', value: alerts.unknown_mention_cases ?? 0, status: 'red', note: 'Needs review' }
      ];
      configs.forEach(alert => {
        const card = document.createElement('div');
        card.className = 'panel kpi-card';
        card.innerHTML = `
          <div class="badge ${alert.status}">${alert.label}</div>
          <div class="kpi-value">${alert.value}</div>
          <p class="muted">${alert.note}</p>`;
        criticalAlertsEl.appendChild(card);
      });
    }

    function renderPatientFlow(flow) {
      patientFlowCardsEl.innerHTML = '';
      const cards = [
        { label: 'Patients Today', value: flow.patients_today ?? 0 },
        { label: 'Completed vs Pending', value: `${flow.completed_today ?? 0} / ${flow.pending_today ?? 0}` },
        { label: 'Avg Symptom Count', value: (flow.avg_symptom_count ?? 0).toFixed(1) },
        { label: 'Active Doctors', value: flow.unique_doctors_today ?? 0 }
      ];
      cards.forEach(item => {
        const card = document.createElement('div');
        card.className = 'kpi-card';
        card.innerHTML = `<span class="muted">${item.label}</span><div class="kpi-value">${item.value}</div>`;
        patientFlowCardsEl.appendChild(card);
      });

      patientsPerHourEl.innerHTML = '';
      const perHour = flow.patients_per_hour || [];
      const maxValue = perHour.reduce((max, item) => Math.max(max, item.count), 0) || 1;
      if (!perHour.length) {
        patientsPerHourEl.innerHTML = '<p class="muted">No consults logged today.</p>';
      } else {
        perHour.forEach(item => {
          const bar = document.createElement('div');
          bar.className = 'chart-bar';
          bar.style.height = `${(item.count / maxValue) * 100}%`;
          bar.innerHTML = `<span>${item.count}</span>`;
          bar.title = `${formatHour(item.hour)} • ${item.count} patients`;
          patientsPerHourEl.appendChild(bar);
        });
      }

      patientInsightsEl.innerHTML = '';
      (flow.insights || ['No operational alerts today.']).forEach(text => {
        const li = document.createElement('li');
        li.textContent = text;
        patientInsightsEl.appendChild(li);
      });
    }

    function renderDoctorWorkload(workload) {
      doctorWorkloadEl.innerHTML = '';
      (workload.per_doctor || []).forEach(doc => {
        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `<strong>${doc.name}</strong><span>${doc.patients} pts • avg symptoms ${doc.avg_symptoms ?? 0}</span>`;
        doctorWorkloadEl.appendChild(row);
      });
      if (!workload.per_doctor || !workload.per_doctor.length) {
        doctorWorkloadEl.innerHTML = '<p class="muted">No consultations recorded yet.</p>';
      }
      if (workload.overloaded && workload.overloaded.length) {
        const alert = document.createElement('p');
        alert.className = 'badge red';
        alert.textContent = `Overloaded doctors: ${workload.overloaded.join(', ')}`;
        doctorWorkloadEl.appendChild(alert);
      }
    }

    function renderEfficiency(eff) {
      efficiencyEl.innerHTML = '';
      const cards = [
        { label: 'Avg Documentation Lag (min)', value: eff.avg_doc_delay_minutes?.toFixed(1) ?? '0' },
        { label: 'Median Lag (min)', value: eff.median_doc_delay_minutes?.toFixed(1) ?? '0' },
        { label: 'Avg Transcript Length', value: `${eff.avg_transcript_chars ?? 0} chars` },
        { label: 'Avg Summary Length', value: `${eff.avg_summary_chars ?? 0} chars` }
      ];
      cards.forEach(metric => {
        const block = document.createElement('div');
        block.className = 'kpi-card';
        block.innerHTML = `<span class="muted">${metric.label}</span><div class="kpi-value">${metric.value}</div>`;
        efficiencyEl.appendChild(block);
      });
    }

    function renderAiReliability(ai) {
      aiReliabilityEl.innerHTML = '';
      if (!ai || !ai.validation_evaluations) {
        aiReliabilityEl.innerHTML = '<p class="muted">No validation data yet.</p>';
        return;
      }
      const passRate = ai.validation_pass_rate != null ? `${(ai.validation_pass_rate * 100).toFixed(0)}%` : 'N/A';
      const unknownRate = ai.unknown_case_rate != null ? `${(ai.unknown_case_rate * 100).toFixed(1)}%` : 'N/A';
      aiReliabilityEl.innerHTML = `
        <div class="kpi-card">
          <span class="muted">Validation Pass Rate</span>
          <div class="kpi-value">${passRate}</div>
          <div class="trend-bar"><span style="width:${(ai.validation_pass_rate || 0) * 100}%"></span></div>
        </div>
        <div class="list-item"><span>Evaluated Summaries</span><strong>${ai.validation_evaluations}</strong></div>
        <div class="list-item"><span>Failures</span><strong>${ai.validation_failures}</strong></div>
        <div class="list-item"><span>Unknown Symptom Rate</span><strong>${unknownRate}</strong></div>`;
    }

    function renderRiskMonitoring(risk) {
      riskMonitoringEl.innerHTML = '';
      const rows = [
        { label: 'High Risk Today', value: risk.high_risk_today ?? 0 },
        { label: 'Unresolved Unknowns', value: risk.unresolved_unknowns ?? 0 }
      ];
      rows.forEach(item => {
        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `<span>${item.label}</span><strong>${item.value}</strong>`;
        riskMonitoringEl.appendChild(row);
      });
      if (risk.risk_distribution && risk.risk_distribution.length) {
        const divider = document.createElement('div');
        divider.className = 'divider';
        riskMonitoringEl.appendChild(divider);
        risk.risk_distribution.forEach(item => {
          const row = document.createElement('div');
          row.className = 'list-item';
          row.innerHTML = `<span>${item.label}</span><strong>${item.value}</strong>`;
          riskMonitoringEl.appendChild(row);
        });
      }
    }

    function renderSystemHealth(health) {
      systemHealthEl.innerHTML = '';
      const rows = [
        { label: 'OpenAI API', value: health.openai_api ? 'Operational' : 'Missing Key' },
        { label: 'AssemblyAI API', value: health.assemblyai_api ? 'Operational' : 'Missing Key' },
        { label: 'Summary Coverage', value: health.summary_coverage != null ? `${(health.summary_coverage * 100).toFixed(0)}%` : 'N/A' },
        { label: 'Audio Records', value: health.audio_records ?? 0 },
        { label: 'Consultations in DB', value: health.consultation_count ?? 0 },
        { label: 'Last Consultation', value: health.last_consultation ? new Date(health.last_consultation).toLocaleString() : 'N/A' }
      ];
      rows.forEach(item => {
        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `<span>${item.label}</span><strong>${item.value}</strong>`;
        systemHealthEl.appendChild(row);
      });
    }

    function renderTrends(trends) {
      trendCardsEl.innerHTML = '';
      (trends.trends_cards || []).forEach(trend => {
        const card = document.createElement('div');
        const statusClass = trend.status || 'gray';
        card.className = 'kpi-card';
        card.innerHTML = `<span class="muted">${trend.label}</span><div class="kpi-value">${trend.value}</div><span class="badge ${statusClass}">${statusClass === 'green' ? 'Positive' : 'Attention'}</span>`;
        trendCardsEl.appendChild(card);
      });
      if (!trends.trends_cards || !trends.trends_cards.length) {
        trendCardsEl.innerHTML = '<p class="muted">Not enough history yet.</p>';
      }
    }

    function renderDashboard(data) {
      renderCriticalAlerts(data.critical_alerts || {});
      renderPatientFlow(data.patient_flow || {});
      renderDoctorWorkload(data.doctor_workload || {});
      renderEfficiency(data.efficiency || {});
      renderAiReliability(data.ai_reliability || {});
      renderRiskMonitoring(data.risk_monitoring || {});
      renderSystemHealth(data.system_health || {});
      renderTrends(data.trends || {});
    }

    async function loadDashboard() {
      try {
        if (statusEl) statusEl.textContent = 'Loading live metrics…';
        const res = await fetch('/dashboard_metrics');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        renderDashboard(data);
        if (statusEl) {
          const stamp = data.generated_at ? new Date(data.generated_at).toLocaleString() : new Date().toLocaleString();
          statusEl.textContent = `Updated ${stamp}`;
        }
      } catch (err) {
        if (statusEl) statusEl.textContent = `Unable to load metrics: ${err.message}`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
